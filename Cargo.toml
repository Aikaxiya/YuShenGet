[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/fetch",
    "crates/store",
    "crates/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gacha-core = { path = "crates/core" }
gacha-fetch = { path = "crates/fetch" }
gacha-store = { path = "crates/store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
url = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
